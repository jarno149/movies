spring:
  application:
    name: movies-service
  datasource:
    url: jdbc:postgresql://localhost:5435/movies
    driverClassName: org.postgresql.Driver
    username: 
    password: 
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# Server configuration
server:
  port: 8088

# Logging
logging:
  level:
    org.springframework: INFO
    com.movies: DEBUG
